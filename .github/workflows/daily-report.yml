name: Daily Report Generation and Deploy

on:
  schedule:
    # 每天 UTC 00:00 執行（台灣時間早上 8 點）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - test

# 設定 GITHUB_TOKEN 的權限
permissions:
  contents: write  # 需要寫入權限來 commit/push
  pages: write
  id-token: write

# 確保同時間只有一個報告生成在執行
concurrency:
  group: "daily-report"
  cancel-in-progress: false

jobs:
  generate-commit-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate daily report (v5 + v6 AI)
        id: generate_report
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ENABLE_AI_ANALYSIS: "true"
        run: |
          # 驗證必要 secrets
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "Error: DEEPSEEK_API_KEY 未設定"
            exit 1
          fi

          # Step 1: 產生 v5 基礎報告
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            echo "Running in test mode..."
            python main.py --test
          else
            echo "Running in full mode..."
            python main.py
          fi

          # 取得今天的日期字串 (台灣時間)
          TODAY=$(date -d '8 hours' +%Y-%m-%d)
          echo "today=$TODAY" >> $GITHUB_OUTPUT

          # 驗證所有報告
          if [ ! -f "reports/${TODAY}.json" ]; then
            echo "Error: v5 報告生成失敗，找不到 reports/${TODAY}.json"
            exit 1
          fi
          if [ ! -f "reports/${TODAY}-lite.json" ]; then
            echo "Error: 精簡報告生成失敗，找不到 reports/${TODAY}-lite.json"
            exit 1
          fi
          if [ ! -f "reports/index.json" ]; then
            echo "Error: 索引更新失敗，找不到 reports/index.json"
            exit 1
          fi
          if [ ! -f "reports/${TODAY}-ai.json" ]; then
            echo "Error: AI 報告生成失敗，找不到 reports/${TODAY}-ai.json"
            exit 1
          fi
          if [ ! -f "reports/${TODAY}-universe.json" ]; then
            echo "Error: Universe 報告生成失敗，找不到 reports/${TODAY}-universe.json"
            exit 1
          fi
          python -m json.tool reports/${TODAY}.json > /dev/null
          python -m json.tool reports/${TODAY}-lite.json > /dev/null
          python -m json.tool reports/index.json > /dev/null
          python -m json.tool reports/${TODAY}-ai.json > /dev/null
          python -m json.tool reports/${TODAY}-universe.json > /dev/null
          echo "✓ 所有報告生成並驗證成功"
      
      - name: Commit and push reports
        id: commit_reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 設定 git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 只添加 reports/ 目錄（不添加 data/）
          git add reports/
          
          # 檢查是否有變更
          if git diff --staged --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            git commit -m "chore: update daily report $(date -d '8 hours' +%Y-%m-%d)"
            git push
            echo "no_changes=false" >> $GITHUB_OUTPUT
            echo "✓ Committed and pushed new reports"
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Prepare site content
        run: |
          # 建立公開目錄
          mkdir -p _site
          
          # 複製 frontend 檔案
          cp -r frontend/* _site/
          
          # 複製 reports 目錄
          cp -r reports _site/
          
          # 確保 reports 目錄有 .nojekyll (防止 Jekyll 處理)
          touch _site/.nojekyll
          
          # 建立 _config.yml
          echo "disable_jekyll: true" > _site/_config.yml
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
