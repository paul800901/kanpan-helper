name: Daily Report Generation

on:
  schedule:
    # 每天 UTC 00:00 執行（台灣時間早上 8 點）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - test

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Backup existing index.json
        run: |
          if [ -f "reports/index.json" ]; then
            cp reports/index.json reports/index.json.bak
            echo "index.json backed up"
          fi
      
      - name: Generate daily report
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            echo "Running in test mode..."
            python main.py --test
          else
            echo "Running in full mode..."
            python main.py
          fi
      
      - name: Safe update index.json
        if: always()
        run: |
          # 如果報告生成失敗，恢復備份的 index.json
          if [ ! -f "reports/$(date -d '8 hours' +%Y-%m-%d)-lite.json" ]; then
            if [ -f "reports/index.json.bak" ]; then
              mv reports/index.json.bak reports/index.json
              echo "Report generation failed, restored index.json from backup"
            fi
            exit 1
          fi
          
          # 如果備份檔案存在，刪除它
          if [ -f "reports/index.json.bak" ]; then
            rm reports/index.json.bak
          fi
      
      - name: Commit and push reports
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 只添加報告相關檔案
          git add reports/
          git add data/
          
          # 檢查是否有變更
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily report $(date -d '8 hours' +%Y-%m-%d)"
            git push
          fi
