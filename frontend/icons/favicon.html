<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
    <style>
        body { margin: 0; background: #1a5f7a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .icon { width: 512px; height: 512px; }
        .icon text { font-family: Arial, sans-serif; font-weight: bold; }
    </style>
</head>
<body>
    <svg class="icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect width="512" height="512" rx="64" fill="#1a5f7a"/>
        <text x="256" y="200" font-size="140" text-anchor="middle" fill="white">看</text>
        <text x="256" y="340" font-size="140" text-anchor="middle" fill="white">盤</text>
        <path d="M100 400 L150 350 L200 380 L250 320 L300 360 L350 300 L400 340" 
              stroke="#ffc107" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</body>
</html>
