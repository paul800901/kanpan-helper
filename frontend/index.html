<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a5f7a">
    <meta name="description" content="看盤助手 - 每日股票分析報告">
    <title>看盤助手</title>
    
    <!-- PWA 支援 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 頂部區 -->
    <header class="header">
        <div class="header-top">
            <h1 class="app-title">看盤助手</h1>
            <button class="reload-btn" id="reloadBtn" title="載入最新報告">🔄</button>
        </div>
        
        <!-- 日期選擇區 -->
        <div class="date-selector">
            <span class="date-label">目前報告：</span>
            <select class="date-dropdown" id="dateDropdown">
                <option value="">載入中...</option>
            </select>
            <span class="date-badge" id="dateBadge"></span>
        </div>
        
        <div class="market-summary" id="marketSummary">--</div>
        
        <!-- 最後更新時間 -->
        <div class="last-updated" id="lastUpdated">--</div>
    </header>

    <!-- 摘要區 -->
    <section class="summary-section" id="summarySection">
        <div class="summary-grid">
            <div class="summary-card top-picks">
                <div class="summary-label">可留意</div>
                <div class="summary-count" id="topPicksCount">0</div>
                <div class="summary-list" id="topPicksList">--</div>
            </div>
            <div class="summary-card watchlist">
                <div class="summary-label">觀察</div>
                <div class="summary-count" id="watchlistCount">0</div>
                <div class="summary-list" id="watchlistList">--</div>
            </div>
            <div class="summary-card avoid-list">
                <div class="summary-label">暫不考慮</div>
                <div class="summary-count" id="avoidCount">0</div>
                <div class="summary-list" id="avoidList">--</div>
            </div>
        </div>
    </section>

    <!-- 篩選列 -->
    <nav class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="可留意">可留意</button>
        <button class="filter-btn" data-filter="觀察">觀察</button>
        <button class="filter-btn" data-filter="偏保守">偏保守</button>
        <button class="filter-btn" data-filter="暫不考慮">暫不考慮</button>
    </nav>

    <!-- 股票列表區 -->
    <main class="stock-list" id="stockList">
        <div class="loading">載入報告中...</div>
    </main>

    <!-- 底部資訊列 -->
    <footer class="footer">
        <div class="footer-item">
            <span class="footer-label">報告日期</span>
            <span class="footer-value" id="footerDate">--</span>
        </div>
        <div class="footer-item">
            <span class="footer-label">總檔數</span>
            <span class="footer-value" id="totalCount">0</span>
        </div>
        <div class="footer-item">
            <span class="footer-label">可留意</span>
            <span class="footer-value highlight-good" id="goodCount">0</span>
        </div>
    </footer>

    <!-- 錯誤提示 Modal -->
    <div class="error-modal" id="errorModal" style="display: none;">
        <div class="error-content">
            <div class="error-icon">⚠️</div>
            <div class="error-title" id="errorTitle">載入失敗</div>
            <div class="error-message" id="errorMessage">無法讀取報告</div>
            <div class="error-actions">
                <button class="error-btn secondary" id="errorCloseBtn">關閉</button>
                <button class="error-btn" id="errorRetryBtn">重新整理</button>
            </div>
        </div>
    </div>

    <!-- 無報告提示 -->
    <div class="empty-modal" id="emptyModal" style="display: none;">
        <div class="empty-content">
            <div class="empty-icon">📊</div>
            <div class="empty-title">尚未產生任何報告</div>
            <div class="empty-message">
                請先執行後端分析程式產生報告<br>
                或使用測試資料
            </div>
            <button class="empty-btn" onclick="loadSampleData()">載入測試資料</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // 註冊 Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker 註冊成功'))
                .catch(err => console.log('Service Worker 註冊失敗:', err));
        }
    </script>
</body>
</html>
