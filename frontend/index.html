<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d1b2a">
    <meta name="description" content="看盤助手 v31 - AI 摘要、steady_v5 啟用判斷與焦點圖表">
    <title>看盤助手 v31</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 頂部 Header -->
    <header class="header">
        <div class="header-top">
            <div class="app-brand">
                <span class="app-title">看盤助手</span>
                <span class="version-badge">v31</span>
            </div>
            <button class="reload-btn" id="reloadBtn" title="重新載入最新報告">↻</button>
        </div>
        <div class="date-row">
            <select class="date-select" id="dateDropdown">
                <option value="">載入中...</option>
            </select>
            <span class="date-badge" id="dateBadge"></span>
        </div>
        <nav class="header-nav">
            <a href="stocks.html" class="nav-link-btn">📊 股票總覽</a>
        </nav>
    </header>

    <!-- 主內容 -->
    <main id="mainContent">

        <!-- 載入狀態 -->
        <div class="loading-state" id="loadingState">
            <div class="loading-spinner"></div>
            <div class="loading-text">載入 AI 報告、策略判斷與焦點圖表中...</div>
        </div>

        <!-- AI 市場總覽 -->
        <section class="ai-overview" id="aiOverview" style="display:none">
            <div class="overview-text" id="marketOverviewAI"></div>
            <div class="focus-list" id="focusList"></div>
        </section>

        <section class="activation-section" id="activationSection" style="display:none">
            <div class="activation-card" id="activationCard">
                <div class="activation-header">
                    <div>
                        <div class="activation-kicker">steady_v5 啟用判斷</div>
                        <div class="activation-title" id="activationTitle">今日策略過濾</div>
                    </div>
                    <div class="activation-status" id="activationStatus">--</div>
                </div>
                <div class="activation-summary" id="activationSummary"></div>
                <div class="activation-note" id="activationNote" style="display:none"></div>
                <div class="activation-meta" id="activationMeta"></div>
                <div class="activation-gates" id="activationGates"></div>
            </div>
        </section>

        <section class="focus-chart-section" id="focusChartSection" style="display:none">
            <div class="section-title">焦點圖表</div>
            <div class="section-subtitle">只放 3 檔，先看迷你 K 線結構，再點進個股頁看完整 K 線、量能與 MACD。</div>
            <div class="focus-chart-legend">
                <span class="focus-chart-legend-item"><span class="legend-dot legend-kline"></span>K 線</span>
                <span class="focus-chart-legend-item"><span class="legend-dot legend-ma5"></span>MA5</span>
                <span class="focus-chart-legend-item"><span class="legend-dot legend-ma20"></span>MA20</span>
            </div>
            <div class="focus-chart-strip" id="focusChartList"></div>
        </section>

        <!-- 分群說明 -->
        <section class="group-section" id="groupSection" style="display:none">
            <div class="group-card group-strong">
                <div class="group-label">🔥 強勢可留意</div>
                <div class="group-ai-text" id="strongestGroupAI"></div>
                <div class="group-tags" id="strongestTags"></div>
            </div>
            <div class="group-card group-watch">
                <div class="group-label">👀 轉強觀察</div>
                <div class="group-ai-text" id="cautionGroupAI"></div>
                <div class="group-tags" id="cautionTags"></div>
            </div>
            <div class="group-card group-avoid">
                <div class="group-label">🚫 今日迴避</div>
                <div class="group-ai-text" id="avoidGroupAI"></div>
                <div class="group-tags" id="avoidTags"></div>
            </div>
        </section>

        <!-- 個股卡片 -->
        <section class="stock-section" id="stockSection" style="display:none">
            <div class="section-title">個股 AI 分析</div>
            <div id="stockList"></div>
        </section>

    </main>

    <!-- 底部資訊列 -->
    <footer class="footer" id="footerBar" style="display:none">
        <span id="footerDate">--</span>
        <span>共 <b id="totalCount">0</b> 檔</span>
        <span>可行動 <b class="good" id="goodCount">0</b></span>
    </footer>

    <!-- 錯誤 Modal -->
    <div class="modal-overlay" id="errorModal" style="display:none">
        <div class="modal-box">
            <div class="modal-icon">⚠️</div>
            <div class="modal-title" id="errorTitle">載入失敗</div>
            <div class="modal-msg" id="errorMsg"></div>
            <div class="modal-actions">
                <button onclick="document.getElementById('errorModal').style.display='none'">關閉</button>
                <button onclick="reloadLatest()">重新整理</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=20260414-v31b"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js?v=20260414-v31b', { updateViaCache: 'none' })
                .then(reg => reg.update())
                .catch(err => console.log('SW 錯誤:', err));
        }
    </script>
</body>
</html>
