<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d1b2a">
    <meta name="description" content="市場情境卡 v8.1 - 只顯示市場層情境，不含個股名稱與買賣建議。">
    <title>市場情境卡 - 看盤助手 v8.1</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-shell {
            min-height: 100vh;
            background: linear-gradient(180deg, #eef3f8 0%, #f8fbfd 100%);
            padding-bottom: 32px;
        }

        .context-header {
            background: linear-gradient(135deg, #0d1b2a, #1b3350);
            padding: 22px 18px 18px;
            color: white;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
        }

        .context-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.4px;
        }

        .header-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 14px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .context-date-select {
            flex: 1;
            min-width: 180px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.14);
            color: white;
            font-size: 14px;
        }

        .context-date-select option {
            color: #1b1b1b;
        }

        .schema-chip,
        .count-chip {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.16);
            color: rgba(255, 255, 255, 0.9);
        }

        .context-main {
            max-width: 920px;
            margin: 0 auto;
            padding: 18px 14px 0;
        }

        .context-help,
        .state-card,
        .fallback-banner,
        .schema-panel,
        .scenario-card {
            background: white;
            border: 1px solid #dbe5ef;
            box-shadow: 0 2px 10px rgba(18, 38, 63, 0.06);
        }

        .context-help,
        .schema-panel,
        .state-card,
        .fallback-banner {
            margin-bottom: 14px;
            padding: 14px 16px;
            border-radius: 14px;
            color: #44586b;
            font-size: 14px;
            line-height: 1.65;
        }

        .schema-panel-title {
            font-size: 14px;
            font-weight: 800;
            color: #17324d;
            margin-bottom: 8px;
        }

        .schema-field-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .schema-field-chip {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 999px;
            background: #eef4fa;
            color: #1f4f80;
            font-size: 12px;
            font-weight: 700;
        }

        .fallback-banner {
            display: none;
            background: linear-gradient(180deg, #fffaf1 0%, #ffffff 100%);
            border-color: #f1d29a;
            color: #835100;
        }

        .card-list {
            display: grid;
            gap: 14px;
        }

        .scenario-card {
            border-radius: 18px;
            padding: 16px;
            overflow: hidden;
        }

        .scenario-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .scenario-title-block {
            flex: 1;
        }

        .scenario-id {
            display: inline-flex;
            align-items: center;
            padding: 4px 9px;
            border-radius: 999px;
            background: #edf4fb;
            color: #1f4f80;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.2px;
            margin-bottom: 8px;
        }

        .scenario-card-title {
            font-size: 19px;
            font-weight: 800;
            color: #17324d;
            line-height: 1.35;
        }

        .scenario-card-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .meta-chip {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
        }

        .confidence-high {
            background: #e7f6ec;
            color: #1b5e20;
        }

        .confidence-medium {
            background: #fff4de;
            color: #9a5b00;
        }

        .confidence-low {
            background: #f1f4f7;
            color: #5b6d7d;
        }

        .relation-aligned {
            background: #e3f2fd;
            color: #1565c0;
        }

        .relation-neutral {
            background: #edf2f6;
            color: #546575;
        }

        .relation-conflict {
            background: #fdecea;
            color: #b3261e;
        }

        .scenario-grid {
            display: grid;
            gap: 12px;
        }

        .scenario-row {
            display: grid;
            grid-template-columns: 112px 1fr;
            gap: 10px;
            align-items: start;
        }

        .scenario-label {
            font-size: 12px;
            font-weight: 800;
            color: #72859a;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .scenario-text {
            font-size: 14px;
            color: #243b53;
            line-height: 1.65;
        }

        .reasoning-list {
            margin: 0;
            padding-left: 18px;
        }

        .reasoning-item {
            margin-bottom: 6px;
        }

        .reasoning-item:last-child {
            margin-bottom: 0;
        }

        .scenario-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #e5edf4;
            color: #60778d;
            font-size: 12px;
        }

        @media (max-width: 720px) {
            .scenario-card-top,
            .scenario-footer {
                flex-direction: column;
            }

            .scenario-card-meta {
                justify-content: flex-start;
            }

            .scenario-row {
                grid-template-columns: 1fr;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="context-header">
            <div class="context-header-top">
                <a href="index.html" class="back-link">← 返回首頁</a>
            </div>
            <div class="header-title">市場情境卡</div>
            <div class="header-subtitle">v8.1 只建立市場層情境載體，不輸出候選股、不點名股票，也不給買賣建議。</div>
            <div class="header-controls">
                <select id="dateSelect" class="context-date-select">
                    <option value="">載入中...</option>
                </select>
                <span class="schema-chip" id="schemaChip">schema --</span>
                <span class="count-chip" id="countChip">0 張卡</span>
            </div>
        </header>

        <main class="context-main">
            <section class="context-help">
                本頁只使用既有市場總覽、分數分布、類股集中度、量能異常、AI 市場總覽與 steady_v5 啟用判斷等現成輸出，作為後續題材推理的基礎載體。不串新聞、不做股票映射，也不讓 AI 自由點名股票。
            </section>

            <section class="schema-panel">
                <div class="schema-panel-title">固定 schema</div>
                <div class="schema-field-list" id="schemaFieldList"></div>
            </section>

            <div class="fallback-banner" id="fallbackBanner"></div>
            <div class="state-card" id="loadingState">載入情境卡中...</div>
            <div class="state-card" id="emptyState" style="display:none"></div>
            <section class="card-list" id="cardList" style="display:none"></section>
        </main>
    </div>

    <script src="context.js?v=20260414-v81a"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js?v=20260414-v31b', { updateViaCache: 'none' })
                .then(reg => reg.update())
                .catch(err => console.log('SW 錯誤:', err));
        }
    </script>
</body>
</html>
